study_version:
  abstract:
    de: 'Diversität in Unternehmen, also die Vielfalt von Mitarbeitenden in Bezug
      auf wahrnehmbare, kategoriale Merkmale, ist in den letzten Jahren zu einem wichtigen
      Thema in der Wirtschaft geworden. Das Projekt betrachtet zwei Dimensionen der
      Diversität: Geschlechterdiversität und kulturelle Diversität. Gleichstellungs-
      und Diversitätsmassnahmen in Unternehmen sollen helfen, personenspezifische
      Benachteiligungen zu beseitigen. Allerdings existieren derzeit keine wissenschaftlichen
      Untersuchungen, die den Erfolg solcher Massnahmen erforscht. Wir tun dies und
      messen zum ersten den tatsächlichen Erfolg unterschiedlicher Diversitätsanstrengungen
      in Unternehmen. Zum zweiten hinterfragen wir, ob Mitarbeiterbewertungen und
      Lohnsysteme bestimmte Gruppen im Unternehmen diskriminieren und damit die Diversität
      verringern. Realisiert werden diese Ziele durch eine repräsentative Untersuchung
      Schweizer und deutscher Organisationen.'
    en: 'Diversity in companies, i.e., the diversity of employees in terms of perceptible,
      categorical characteristics, has become an important topic in business in recent
      years. The project looks at two dimensions of diversity: gender diversity and
      cultural diversity. Equality and diversity measures in companies should help
      to eliminate person-specific disadvantages. However, there are currently no
      scientific studies that investigate the success of such measures. We do this
      and firstly measure the actual success of different diversity efforts in companies.
      Secondly, we analyze whether employee evaluations and pay systems discriminate
      against certain groups in the company and thus reduce diversity. These objectives
      are realized through a representative study of Swiss and German Organizations.'
