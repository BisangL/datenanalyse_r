dataset_version:
  DOI: 10.48573/0v8n-0h83
  additional_information: 'Fragebogen zum Thema Diversity, der sich an Schweizer und
    deutsche Organisationen (Grossteil gewinnorientierte Firmen) richtet. Abgefragt
    werden Diversity-Massnahmen, die innerhalb der Organisation durchgeführt werden,
    sowie weitere Massnahmen, die zur Steigerung der Diversität im Management beitragen
    könnten.

    Der Fragebogen umfasst zwei Wellen. Bei der zweiten Befragung wurden einige Fragen
    weggelassen und durch andere Fragen ergänzt. Der Grossteil der Fragen ist gleich
    geblieben und erlaubt einen Vergleich der zwei Zeitpunkte.

    Erhebung der 1. Welle: Sept. 2017 - Nov. 2017

    Erhebung der 2. Welle: Nov. 2019 - Jan. 2020

    Der Datensatz enthält beide Zeitpunkte (Variable: Wave)'
